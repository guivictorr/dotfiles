set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# reload settings
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# fix delay of vim escape-time
set -g escape-time 0

# change prefix to control + a
set -g prefix ^A

# start indexing windows at 1 instead of 0
set -g base-index 1

bind r command-prompt "rename-window %%"

# change window holding control and pressing a + p or n
bind C-p previous-window
bind C-n next-window

bind C new-window -c "$HOME"
bind D detach
bind c kill-pane
bind x swap-pane -D
bind S choose-session

# split panes using d and s
bind s split-window -v -c "#{pane_current_path}"
bind d split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Catppuccin theme (options must be set before the plugin loads via tpm)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_window_text " #W#{?window_zoomed_flag, 󰍉,}"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰍉,}"
set -g @catppuccin_application_icon " "
set -g @catppuccin_session_icon "󰕰 "

set-option -g status-position top
set-option -g status-justify left
set-option -g status-left-length 100
set-option -g status-right-length 100

# Second status line used as a separator between tmux and the panes
set-option -g status 2
set-option -g status-format[1] "#[fg=#{@thm_surface_1}]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"

# Windows on the left, modules on the far right
# (session icon turns red while prefix is active)
set-option -g status-left ""
set-option -g status-right "#{E:@catppuccin_status_application}"
set-option -ag status-right "#{E:@catppuccin_status_session}"
set-option -ag status-right "#{E:@catppuccin_status_date_time}"

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Optional local Claude Code usage modules (not versioned)
source-file -q ~/.config/tmux/claude.conf
